services:
  - type: web
    name: codearena-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: codearena-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: codearena-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: codearena-db
          property: password
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: codearena-db
    databaseName: codearena
    user: postgres
